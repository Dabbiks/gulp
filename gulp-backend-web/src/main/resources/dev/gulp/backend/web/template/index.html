<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>{{title}}</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #gulp-canvas { display: block; width: 100vw; height: 100vh; outline: none; touch-action: none; }
  #gulp-loading {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; background: #111; color: #ddd; font: 16px system-ui, sans-serif;
  }
  #gulp-loading .bar { width: min(320px, 70vw); height: 6px; border-radius: 3px; background: #333; overflow: hidden; }
  #gulp-loading .fill { width: 0; height: 100%; background: #ffa300; transition: width .15s; }
  #gulp-loading .error { color: #ff6b6b; max-width: 80vw; white-space: pre-wrap; text-align: center; }
</style>
</head>
<body>
<canvas id="gulp-canvas"></canvas>
<div id="gulp-loading">
  <div class="title">{{title}}</div>
  <div class="bar"><div class="fill"></div></div>
  <div class="status">Loading…</div>
</div>
<script src="gulp-runtime.js"></script>
<script>
(function () {
  "use strict";
  const NAME = "{{name}}";
  const TARGETS = "{{targets}}".split(",");
  const status = document.querySelector("#gulp-loading .status");
  const fill = document.querySelector("#gulp-loading .fill");
  let started = false;

  window.gulpShowError = function (message) {
    let loading = document.getElementById("gulp-loading");
    if (!loading) {
      loading = document.createElement("div");
      loading.id = "gulp-loading";
      document.body.appendChild(loading);
    }
    loading.innerHTML = "";
    const text = document.createElement("div");
    text.className = "error";
    text.textContent = message;
    loading.appendChild(text);
  };

  // A minimal module with a struct type: valid only where Wasm GC is supported.
  function supportsWasmGc() {
    try {
      return typeof WebAssembly === "object" && WebAssembly.validate(
        new Uint8Array([0, 97, 115, 109, 1, 0, 0, 0, 1, 5, 1, 95, 1, 120, 0]));
    } catch (e) {
      return false;
    }
  }

  // Downloads a file with progress; the browser cache then serves the real load.
  async function download(url) {
    const response = await fetch(url);
    if (!response.ok) throw new Error("HTTP " + response.status + " for " + url);
    const total = Number(response.headers.get("Content-Length")) || 0;
    if (!response.body || !total) return;
    const reader = response.body.getReader();
    let received = 0;
    for (;;) {
      const { done, value } = await reader.read();
      if (done) break;
      received += value.length;
      fill.style.width = Math.min(100, received * 100 / total) + "%";
    }
  }

  function script(url) {
    return new Promise((resolve, reject) => {
      const element = document.createElement("script");
      element.src = url;
      element.onload = resolve;
      element.onerror = () => reject(new Error("Cannot load " + url));
      document.head.appendChild(element);
    });
  }

  async function startWasm() {
    status.textContent = "Downloading…";
    await download(NAME + ".wasm");
    status.textContent = "Starting…";
    await script(NAME + ".wasm-runtime.js");
    const teavm = await TeaVM.wasmGC.load(NAME + ".wasm");
    started = true;
    teavm.exports.main([]);
  }

  async function startJs() {
    status.textContent = "Downloading…";
    await download(NAME + ".js");
    status.textContent = "Starting…";
    await script(NAME + ".js");
    started = true;
    main([]);
  }

  async function start() {
    const forced = new URLSearchParams(location.search).get("target");
    const wasm = forced ? forced === "wasm" : TARGETS.includes("wasm") && supportsWasmGc();
    try {
      if (wasm) {
        try {
          await startWasm();
          return;
        } catch (e) {
          if (forced || started || !TARGETS.includes("js")) throw e;
          console.warn("[gulp] Wasm GC failed, falling back to JavaScript", e);
        }
      }
      await startJs();
    } catch (e) {
      console.error(e);
      window.gulpShowError("The game could not start.\n" + (e && e.message || e));
    }
  }

  start();
})();
</script>
</body>
</html>
