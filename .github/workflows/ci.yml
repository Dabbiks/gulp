name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Format, compile, test, coverage
        run: ./gradlew check --console=plain

  desktop-smoke:
    name: desktop window and visual tests (Linux, Xvfb + Mesa)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Xvfb and Mesa (software OpenGL)
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libglx-mesa0
      - name: Open the showcase window for 120 frames
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :examples:showcase:runDesktop -Pgulp.exitAfterFrames=120 --console=plain
      - name: Visual tests against reference images
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew :gulp-backend-desktop:visualTest --console=plain
      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-test-screenshots
          path: gulp-backend-desktop/build/visual

  web:
    name: web build and smoke test (Chromium, Firefox, WebKit)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the showcase for browsers
        run: ./gradlew :examples:showcase:buildWeb --console=plain
      - name: Bundle size (gzip)
        run: |
          cd examples/showcase/build/web
          for f in game.wasm game.js game.wasm-runtime.js gulp-runtime.js index.html; do
            echo "$f: $(wc -c < "$f") bytes, $(gzip -9c "$f" | wc -c) gzipped"
          done
      - name: Install headless browsers
        run: ./gradlew :examples:showcase:installBrowsers --console=plain
      - name: Smoke test in headless browsers
        run: ./gradlew :examples:showcase:webSmokeTest --console=plain
